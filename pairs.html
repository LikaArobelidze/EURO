<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EUROINS — 5 ვარიანტი × ყველა წყვილი</title>
<style>
  /* საიტის ნამდვილი შრიფტი */
  @font-face { font-family: FiraGo; src: url(fonts/firago-regular.woff2) format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: FiraGo; src: url(fonts/firago-medium.woff2) format('woff2'); font-weight: 500; font-display: swap; }
  @font-face { font-family: FiraGo; src: url(fonts/firago-semibold.woff2) format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: FiraGo; src: url(fonts/firago-bold.woff2) format('woff2'); font-weight: 700; font-display: swap; }

  :root { --blue: #1D3687; --navy: #162148; --yellow: #FFC500; --ink: #0A0A0A; --ease: cubic-bezier(.32,.72,.2,1);
          --limg: url(pairs/left_blue.jpg);
          --rimg: url(pairs/r1.jpg); --rpos: 56% 50%; --rs: 1.02; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: FiraGo, "Segoe UI", sans-serif; background: #fff; color: var(--navy); }

  /* ---- მარჯვენა ფოტოს ამრჩევი ---- */
  .picker { position: sticky; top: 0; z-index: 60; background: #fff; border-bottom: 1px solid #e6eaf2;
            padding: 14px 40px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .picker b { font-size: 15px; margin-right: 8px; }
  .picker button { font-family: inherit; font-size: 14px; padding: 8px 15px; border-radius: 999px; cursor: pointer;
                   border: 1px solid #d6dcea; background: #fff; color: var(--navy); transition: all .2s ease; }
  .picker button:hover { border-color: var(--blue); }
  .picker button.on { background: var(--blue); border-color: var(--blue); color: #fff; }

  /* ---- ჰედერი: გამჭვირვალე, ბანერზე ზემოდან, თეთრი ლოგო ---- */
  .top { height: 92px; display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 0 40px;
         position: absolute; top: 0; left: 0; right: 0; background: transparent; z-index: 30; color: #fff; }
  @media (min-width: 1536px) { .top { padding: 0 80px; } }
  .top img.logo { height: 46px; width: auto; display: block; filter: brightness(0) invert(1); }
  .top nav { display: flex; gap: 30px; font-size: 16px; color: #fff; font-weight: 400; }
  .top nav span { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .top nav span::after, .top .lang::after { content: ""; width: 8px; height: 8px; border-right: 1.6px solid #fff; border-bottom: 1.6px solid #fff; transform: rotate(45deg) translate(-1px, -1px); }
  .top .right { display: flex; align-items: center; gap: 22px; }
  .top .phone { display: inline-flex; align-items: center; gap: 9px; background: var(--yellow); color: var(--ink); font-weight: 500; font-size: 16px; padding: 11px 24px; border-radius: 999px; }
  .top .lang { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; cursor: pointer; color: #fff; }
  @media (max-width: 1100px) { .top nav { display: none; } }

  /* ---- ბანერი: საიტის ზუსტი პარამეტრები + გადაფარვა ---- */
  /* ერთი ანიმაციის ორი ფოტო ერთად დგას, ჯგუფებს შორის კი უფრო დიდი სივრცეა */
  #app > div + div { margin-top: 140px; }
  #app > div:nth-child(odd):not(:first-child) { margin-top: 240px; }
  #app > div:last-child { margin-bottom: 200px; }

  .hero { position: relative; display: block; height: 736px; min-height: 420px; overflow: hidden; background: #06122e; }
  .p { position: absolute; top: 0; bottom: 0; overflow: hidden; cursor: pointer;
       transition: width .7s var(--ease), box-shadow .5s ease; }
  .p.l { left: 0; width: 60%; z-index: 2; box-shadow: 30px 0 70px rgba(0,0,0,.5); }
  .p.r { right: 0; width: 44%; z-index: 1; }   /* 60 + 44 = 104% → 4% გადაფარვა */
  .hero .p.l:hover { width: 66%; }
  .hero .p.r:hover { width: 56%; z-index: 3; box-shadow: -30px 0 70px rgba(0,0,0,.5); }

  .p .img { position: absolute; inset: 0; background-size: cover;
            transition: transform .8s var(--ease), filter .6s ease, opacity .6s ease; }
  .p.l .img { background-image: var(--limg); background-position: 50% 50%; transform: scale(1.02); }
  .p.r .img { background-image: var(--rimg); background-position: var(--rpos); transform: scale(var(--rs)); }

  .p .veil { position: absolute; inset: 0; transition: opacity .6s ease, backdrop-filter .6s ease;
             background: linear-gradient(180deg, rgba(10,18,46,.3) 0%, rgba(10,18,46,.12) 45%, rgba(10,18,46,.5) 100%); }

  /* ტექსტი: ორივე მხარეს მარცხნივ, თავისი ფოტოს კიდიდან ერთნაირად დაშორებული */
  .p .body { position: absolute; left: 24px; bottom: 258px; color: #fff; z-index: 3; transition: transform .6s var(--ease), opacity .5s ease; }
  @media (min-width: 1280px) { .p .body { left: 40px; } }
  @media (min-width: 1536px) { .p .body { left: 80px; } }
  .p h1 { font-size: clamp(26px, 2.9vw, 48px); line-height: 1.22; font-weight: 700; margin: 0 0 36px; display: block; max-width: 520px; }
  /* მარჯვენას ემატება 4vw — ზუსტად იმდენი, რამდენითაც მარცხენა ფოტო მას ფარავს */
  .p.r .body { left: calc(4vw + 24px); right: 24px; text-align: left; }
  @media (min-width: 1280px) { .p.r .body { left: calc(4vw + 40px); right: 40px; } }
  @media (min-width: 1536px) { .p.r .body { left: calc(4vw + 80px); right: 80px; } }
  /* მარცხენა ფოტოს გაფართოებისას მარჯვენა ტექსტი 6vw-ით გადაიწევს, რომ არ დაიფაროს */
  .hero .p.l:hover ~ .p.r .body { transform: translateX(6vw); }

  .cta { display: inline-flex; align-items: center; gap: 8px; background: var(--yellow); color: var(--ink); font-weight: 500; font-size: 16px; padding: 12px 26px; border-radius: 999px; text-decoration: none; transition: background .3s ease; }
  .cta:hover { background: #ffd23d; }
  .cta i { font-style: normal; transition: transform .35s var(--ease); }

  /* ===== A · ყვითელი ხაზი ===== */
  .v3 .p h1 { width: fit-content; padding-bottom: 10px; background-image: linear-gradient(var(--yellow), var(--yellow)); background-repeat: no-repeat; background-position: 0 100%; background-size: 0% 4px; transition: background-size .6s var(--ease); }
  .v3 .p:hover h1 { background-size: 100% 4px; }
  .v3 .p:hover .body { transform: translateY(-10px); }
  .v3 .p:hover .img { filter: brightness(1.08); }
  .v3 .hero:hover .p:not(:hover) .veil { backdrop-filter: blur(2.5px); background: linear-gradient(180deg, rgba(10,18,46,.45), rgba(10,18,46,.55)); }
  .v3 .hero:hover .p:not(:hover) .body { opacity: .85; }

  /* ===== B · მინის ეფექტი ===== */
  .v8 .p .veil { backdrop-filter: blur(0px); }
  .v8 .hero:hover .p:not(:hover) .veil { backdrop-filter: blur(6px); background: linear-gradient(180deg, rgba(10,18,46,.55), rgba(10,18,46,.65)); }
  .v8 .p:hover .img { transform: scale(calc(var(--zs, 1) * 1.05)); }

  /* ===== C · ყვითელი ჩარჩო: მხოლოდ ორი გვერდი ===== */
  .frame { position: absolute; inset: 22px; z-index: 2; pointer-events: none; }
  .frame::before, .frame::after { content: ""; position: absolute; left: 0; top: 0; background: var(--yellow); }
  .frame::before { height: 3px; width: 0; transition: width .5s var(--ease); }
  .frame::after { width: 3px; height: 0; transition: height .5s var(--ease) .12s; }
  .v10 .p:hover .frame::before { width: 100%; }
  .v10 .p:hover .frame::after { height: 100%; }
  .v10 .p:hover .body { transform: translateX(14px); }
  .v10 .p:hover .img { transform: scale(calc(var(--zs, 1) * 1.03)); }

  /* ===== D · ყვითელი ზოლი კიდეზე ===== */
  .v11 .p.l::after, .v11 .p.r::before { content: ""; position: absolute; top: 0; bottom: 0; width: 6px;
                                        background: var(--yellow); z-index: 4; transition: width .5s var(--ease); }
  .v11 .p.l::after { right: 0; } .v11 .p.r::before { left: 0; }
  .v11 .hero .p.l:hover::after { width: 18px; }
  .v11 .hero .p.r:hover::before { width: 18px; }
  .v11 .p:hover .img { transform: scale(calc(var(--zs, 1) * 1.04)); }

  /* ===== E · ლურჯი ფარდა ===== */
  .v12 .hero:hover .p:not(:hover) .veil { background: linear-gradient(180deg, rgba(29,54,135,.72), rgba(22,33,72,.84)); }
  .v12 .hero:hover .p:not(:hover) .img { filter: saturate(.7); }
  .v12 .p:hover .img { transform: scale(calc(var(--zs, 1) * 1.04)); }

  /* ზუმის საბაზისო მასშტაბი თითოეული მხარისთვის */
  .p.l { --zs: 1.02; } .p.r { --zs: var(--rs); }


  @media (max-width: 860px) {
    #app > div + div { margin-top: 70px; }
    .hero { height: auto; }
    .p { position: relative; width: 100% !important; height: 52vh; box-shadow: none !important; }
    .p .body, .p.r .body { bottom: 56px; left: 24px; right: 24px; text-align: left; transform: none !important; }
    .p h1 { max-width: none; }
  }
</style>
</head>
<body>

<!-- ჰედერი პირველ ბანერზე აწევს, ამიტომ #stage-ის შიგნითაა და არა გვერდის თავში -->
<div id="stage" style="position:relative">
  <div class="top">
    <img class="logo" src="euroins-logo.png" alt="EUROINS">
    <nav><span>ჩემთვის</span><span>ბიზნესისთვის</span><span>ევროინსი</span><span>მომსახურება</span></nav>
    <div class="right"><span class="phone">📞 220 30 30</span><span class="lang">ქარ</span></div>
  </div>
  <div id="app"></div>
</div>



<script>
  // [ფაილი, background-position, საბაზისო scale, სახელი]
  const PHOTOS = [
    ['pairs/r1.jpg', '56% 50%', 1.02, 'ქართლის დედა'],
    ['pairs/r2.jpg', '50% 50%', 1.02, 'თბილისი ღამით'],
  ];

  // ყველა ვარიანტი ერთ გვერდზე; თითოეული ანიმაცია ორჯერ — ჯერ ერთი ფოტოთი, მერე მეორით
  const VARIANTS = ['v3', 'v8', 'v10', 'v11', 'v12'];

  const banner = (v, ph) => `
    <div class="${v}" style="--rimg:url(${ph[0]}); --rpos:${ph[1]}; --rs:${ph[2]}">
      <div class="hero">
        <div class="p l"><div class="img"></div><div class="veil"></div><div class="frame"></div>
          <div class="body"><h1>სამოგზაურო დაზღვევა</h1><a class="cta" href="#">შეიძინე ონლაინ <i>→</i></a></div></div>
        <div class="p r"><div class="img"></div><div class="veil"></div><div class="frame"></div>
          <div class="body"><h1>ვიზიტორთა სავალდებულო დაზღვევა</h1><a class="cta" href="#">შეიძინე ონლაინ <i>→</i></a></div></div>
      </div>
    </div>`;

  document.getElementById('app').innerHTML =
    VARIANTS.map(v => PHOTOS.map(ph => banner(v, ph)).join('')).join('');

</script>
</body></html>
